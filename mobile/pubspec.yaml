name: darewire
description: DAREWIRE - adults-only, AI-powered live challenge game. Take on dares live, challenge friends to duels, earn points.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  supabase_flutter: ^2.8.0
  livekit_client: ^2.3.0
  web_socket_channel: ^3.0.1
  http: ^1.2.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shared_preferences: ^2.3.2
  video_player: ^2.9.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/icon.png
  adaptive_icon_background: "#15151A"
  adaptive_icon_foreground: assets/brand/icon_fg.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/avatars/
    - assets/demo/
